name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile || bun install
      # Runs as a checker only — this project ships plain JS with no build step.
      # Catches misuse of opencode's API (wrong argument shapes, fields that do
      # not exist) which otherwise fails silently inside a try/catch.
      - run: bun run typecheck
      - run: bun test
      # The inspector must run under both runtimes; bun:sqlite and node:sqlite
      # are mutually exclusive built-ins.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli.js path
      - run: bun src/cli.js path
